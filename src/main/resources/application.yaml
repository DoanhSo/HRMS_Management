spring:
  application:
    name: hr-management-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hr_management_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 6000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: no-reply@example.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/auth
      - classpath:db/migration/employee
      - classpath:db/migration/department
      - classpath:db/migration/position
      - classpath:db/migration/attendance
      - classpath:db/migration/leave
      - classpath:db/migration/payroll
      - classpath:db/migration/audit
      - classpath:db/migration/notification
      - classpath:db/migration/kpi
      - classpath:db/migration/optimization
      - classpath:db/migration/seed

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: 9a2f8c4e1b7d6a5e3f2c1b4a6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 604800000